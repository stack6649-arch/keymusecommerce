<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#333;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
  <div>Redirecting…</div>
  <script>
    (function () {
      var base = '/keymusecommerce';
      var path = location.pathname;
      
      // Only redirect if the path is not already at base or within keymusecommerce
      if (path !== base && path !== base + '/' && path.indexOf(base + '/') !== 0) {
        // For 404 errors on routes like /keymusecommerce/shoes, serve index.html
        location.replace(base + '/index.html' + location.search + location.hash);
      }
    })();
  </script>
</body>
</html>
