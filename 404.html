<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#333;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
  <div>Redirecting…</div>
  <script>
    (function () {
      var base = '/keymusecommerce';
      if (location.pathname === base || location.pathname.indexOf(base + '/') === 0) return;
      var target = base + (location.pathname === '/' ? '/' : location.pathname) + (location.search || '') + (location.hash || '');
      // Simple navigation (no fetch). Guaranteed to work.
      location.replace(target);
    })();
  </script>
</body>
</html>
