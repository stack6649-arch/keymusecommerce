<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Redirecting..." />
    <title>Redirecting...</title>
    <script>
      // Redirect all 404s to the root index.html
      var pathSegments = location.pathname.split('/').filter(Boolean);
      
      // If path contains 'keymusecommerce', keep everything after it
      var keymusecomerceIndex = pathSegments.indexOf('keymusecommerce');
      if (keymusecomerceIndex !== -1) {
        // Redirect to index.html in the keymusecommerce directory
        location.replace(
          '/keymusecommerce/index.html?redirect=' + 
          encodeURIComponent(location.pathname + location.search + location.hash)
        );
      } else {
        // Fallback
        location.replace('/keymusecommerce/');
      }
    </script>
  </head>
  <body>
    Loading...
  </body>
</html>
