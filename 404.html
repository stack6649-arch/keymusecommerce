<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
  <style>html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#333;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
  <div>Redirecting…</div>
  <script>
    (function () {
      var base = '/keymusecommerce';
      // Avoid loop if already under base
      if (location.pathname === base || location.pathname.indexOf(base + '/') === 0) return;
      var target = base + (location.pathname === '/' ? '/' : location.pathname) + (location.search || '') + (location.hash || '');
      // Try to fetch project's index.html and replace the document so SPA can mount
      fetch(base + '/index.html').then(function(r){ return r.text(); }).then(function(html){
        document.open(); document.write(html); document.close();
        // set the browser URL to the requested path under /keymusecommerce
        history.replaceState({}, '', target);
      }).catch(function(){ 
        // fallback: full redirect to the project path
        location.replace(target); 
      });
    })();
  </script>
</body>
</html>
